# =========================================================
# Spring Boot
# =========================================================
spring.application.name=demo

server.port=8083

# Nginx Reverse Proxy / Tailscale
server.forward-headers-strategy=framework


# =========================================================
# MariaDB
# =========================================================
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/reactdb
spring.datasource.username=totoro
spring.datasource.password=totoro

# =========================================================
# MyBatis
# =========================================================
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

logging.level.com.example.board.mapper=TRACE


# =========================================================
# Multipart
# =========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB


# =========================================================
# File Upload
# Linux
# =========================================================

file.upload-dir=/upload/

# =========================================================
# Naver OAuth2
# =========================================================

# Registration
spring.security.oauth2.client.registration.naver.client-id=I1su4VJyVqMgmLJ_Uha8
spring.security.oauth2.client.registration.naver.client-secret=QgSeqSBb0I
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code

# Nginx
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.naver.scope=name,email,profile_image


# =========================================================
# Naver OAuth2 Provider
# =========================================================
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response


