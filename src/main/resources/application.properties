# =========================================================
# Spring Boot
# =========================================================
spring.application.name=demo

#server.port=8083

#docker
server.port=8084

# Nginx Reverse Proxy / Tailscale
server.forward-headers-strategy=framework


# =========================================================
# MariaDB
# =========================================================
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
#spring.datasource.url=jdbc:mariadb://localhost:3306/reactdb
#spring.datasource.username=totoro
#spring.datasource.password=totoro

#docker
spring.datasource.url=jdbc:mariadb://${DB_HOST:mariadb}:${DB_PORT:3306}/${DB_NAME:reactdb}
spring.datasource.username=${DB_USERNAME:totoro}
spring.datasource.password=${DB_PASSWORD:totoro}
# =========================================================
# MyBatis
# =========================================================
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

logging.level.com.example.board.mapper=TRACE


# =========================================================
# Multipart
# =========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB


# =========================================================
# File Upload
# Linux ??
# =========================================================
